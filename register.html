<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <title>Register CRS</title>

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CRS - Course Register</h1>
        </div>
        <div class="navbar">
            <a href="index.html"><button> Home</button></a>
            <a href="available.html"><button>  Available Courses</button></a>
            <a href="enrolled.html"><button> Enrolled Students</button></a>
        </div>

        <form class="form" action="http://localhost:8080/courses/register" method="post">
                <input placeholder="Enter your name" class="input" type="text" name="name">
                <input placeholder="Enter your email" class="input" type="email" name="emailId" >
                <label for="course">Choose a Course</label>
                <select id="course" name="courseName">
                    <option disabled selected>Select</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                    <option value="C">C</option>
                    <option value="Javascript">Javascript</option>
                </select>
                <button type="submit" name="submit" class="register-btn">Submit</button>
        </form>


    </div>
</body>
</html>
